      state.alerts=rows.map(a=>({id:a.id,severity:a.severity||a.riskLevel||"MEDIUM",type:a.alertType||a.type||"ALERT",title:a.title||"Canh bao van hanh",message:a.message||a.description||"",time:timeAgo(a.createdAt||a.occurredAt),read:!!(a.readAt||a.isRead),zone:a.zoneName||a.zone||"Toan cang",isSimulation:!!a.isSimulation})).sort((a,b)=>(a.read-b.read)||severityRank(b.severity)-severityRank(a.severity));
    }
    function normalizeTasks(result){
      const rows=result.data||result.items||result||[];
      state.taskMigrationNotice="";
      state.tasks=rows.map(t=>({id:t.id||t.taskId||"TASK",title:t.title||t.actionDescription||t.actionType||"SOP Task",zone:t.zoneName||t.zone||"Toan cang",priority:t.riskLevelAtCreation||t.priority||"MEDIUM",status:t.status||"PENDING",assignee:t.assignee||"Doi van hanh",time:timeAgo(t.createdAt||t.executedAt),isSimulation:!!t.isSimulation}));
    }

    async function refreshAlerts(){normalizeAlerts(await api(`/api/ports/${state.portId}/alerts?includeSimulation=${state.isSimulationActive}&pageSize=20`))}
    async function refreshTasks(){try{normalizeTasks(await api(`/api/ports/${state.portId}/tasks?includeSimulation=${state.isSimulationActive}&pageSize=20`))}catch(e){if(e.status===400&&(e.code==="TASK_STATUS_NOT_SUPPORTED"||String(e.message).includes("TASK_STATUS_NOT_SUPPORTED"))){state.taskMigrationNotice="He thong dang doi migration bo sung cot trang thai vao DB";state.tasks=[];return}throw e}}
    async function refreshAll(silent=false){try{await Promise.all([refreshLiveStatus(),refreshAlerts(),refreshTasks()]);renderApp();if(!silent)toast("Da cap nhat",state.isSimulationActive?"Dang doc du lieu mo phong cach ly.":"Dang doc du lieu van hanh that.")}catch(e){handleApiError(e,"Tai du lieu")}}

    function startSimulation(){
      if(state.simulation.timer)clearInterval(state.simulation.timer);
      const steps=[
        {p:12,wind:6.4,b:4,rain:3.2,vis:12,risk:"LOW",mode:"NORMAL",title:"Bắt đầu thu thập dữ liệu",detail:"Điều kiện ổn định, vận hành bình thường.",icon:"refresh"},
        {p:32,wind:12.8,b:6,rain:12.5,vis:8,risk:"MEDIUM",mode:"NORMAL",title:"Rủi ro tăng lên MEDIUM",detail:"Tăng tần suất giám sát và giảm tốc phương tiện.",icon:"alert"},
        {p:57,wind:18.4,b:8,rain:28.5,vis:4.2,risk:"HIGH",mode:"LIMITED",title:"Kích hoạt SOP mức HIGH",detail:"Chuyển chế độ LIMITED và tạo 7 nhiệm vụ.",icon:"rules"},
        {p:81,wind:25.2,b:10,rain:54.8,vis:.8,risk:"CRITICAL",mode:"STOP",title:"Rủi ro đạt CRITICAL",detail:"Dừng toàn bộ hoạt động cầu cảng.",icon:"alert"},
        {p:100,wind:20.1,b:9,rain:31.4,vis:3.1,risk:"HIGH",mode:"LIMITED",title:"Mô phỏng hoàn tất",detail:"Đã tổng hợp kết quả và lưu audit trail.",icon:"check"}
      ];
      state.simulation={...state.simulation,running:true,progress:0,step:0,complete:false,events:[]};
      const speed=+(document.getElementById("sim-speed")?.value||220);
      const advance=()=>{
        const s=steps[state.simulation.step];if(!s){finishSimulation();return}
        state.simulation.progress=s.p;state.weather={...state.weather,wind:s.wind,beaufort:s.b,rain:s.rain,visibility:s.vis};state.riskLevel=s.risk;state.operationMode=s.mode;
        state.simulation.events.push({title:s.title,detail:s.detail,risk:s.risk,icon:s.icon,time:new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit",second:"2-digit"})});
        if(s.risk==="CRITICAL"&&!state.alerts.some(a=>a.id===99))state.alerts.unshift({id:99,severity:"CRITICAL",type:"SIMULATION",title:"[Mô phỏng] Rủi ro đạt CRITICAL",message:"Kịch bản mô phỏng đã kích hoạt chế độ STOP.",time:"Vừa xong",read:false,zone:"Toàn cảng"});
        state.simulation.step++;renderApp();if(state.simulation.step>=steps.length)setTimeout(finishSimulation,speed);
      };
      advance();state.simulation.timer=setInterval(advance,speed);
    }
    function finishSimulation(){clearInterval(state.simulation.timer);state.simulation.timer=null;state.simulation.running=false;state.simulation.complete=true;state.simulation.progress=100;renderApp();toast("Mô phỏng hoàn tất","Đã tạo báo cáo kết quả và cập nhật nhật ký vận hành.")}
    function stopSimulation(){clearInterval(state.simulation.timer);state.simulation.timer=null;state.simulation.running=false;renderApp();toast("Đã dừng mô phỏng","Dữ liệu hiện tại được giữ lại để xem xét.","error")}
    async function handleAction(el){
      const action=el.dataset.action,id=el.dataset.id;
      if(action==="toggle-password"){const input=el.closest(".password-wrap").querySelector("input");input.type=input.type==="password"?"text":"password"}
      else if(action==="demo-login"){const a=state.accounts[el.dataset.role]||state.accounts.ADMIN;try{await loginWithApi(a.email,"Admin@2026!")}catch(e){handleApiError(e,"Dang nhap demo")}}
      else if(action==="toggle-sidebar"){state.sidebarOpen=!state.sidebarOpen;renderApp()}
      else if(action==="toggle-account"){state.accountOpen=!state.accountOpen;renderApp()}
      else if(action==="refresh"){el.disabled=true;await refreshAll();el.disabled=false}
      else if(action==="logout"){localStorage.removeItem("porms_token");state.token="";state.authenticated=false;state.accountOpen=false;stopPolling();renderApp()}
      else if(action==="switch-role"){showRoleSwitcher()}
      else if(action==="select-role"){loginAs(el.dataset.role);closeOverlay();toast("Đã chuyển vai trò",`Đang xem với quyền ${roleLabel[el.dataset.role]}.`)}
      else if(action==="close-overlay"){closeOverlay()}
      else if(action==="override-mode"){showModeOverride()}
      else if(action==="alert-detail"){showAlertDetail(id)}
      else if(action==="mark-read"){try{await api(`/api/alerts/${id}/read`,{method:"PUT"});closeOverlay();await refreshAlerts();renderApp();toast("Da xac nhan canh bao","Trang thai da cap nhat xuong PostgreSQL.")}catch(e){handleApiError(e,"Xac nhan alert")}}
      else if(action==="mark-all"){for(const a of state.alerts.filter(x=>!x.read)){try{await api(`/api/alerts/${a.id}/read`,{method:"PUT"})}catch{}}await refreshAlerts();renderApp();toast("Da doc tat ca","Khong con canh bao chua doc.")}
      else if(action==="port-detail"){state.selectedPort=id;navigate("port-detail")}
      else if(action==="port-form"){showPortForm()}
      else if(action==="zone-form"){showZoneForm(id)}
      else if(action==="zone-threshold"){showZoneThreshold(id)}
      else if(action==="user-form"){showUserForm(id)}
      else if(action==="unlock-user"){const u=state.users.find(x=>x.id===+id);if(u)u.status="ACTIVE";renderApp();toast("Đã mở khóa tài khoản",`${u.name} có thể đăng nhập trở lại.`)}
      else if(action==="save-thresholds"){toast("Đã lưu cấu hình","Ngưỡng mới sẽ có hiệu lực trong vòng 5 phút.")}
      else if(action==="sop-form"){showSopForm(id)}
      else if(action==="preset-scenario"){state.simulation.scenario=el.dataset.scenario||"storm";state.simulation.complete=false;state.simulation.progress=0;state.simulation.lastMessage="Chua chay";renderApp()}
      else if(action==="scenario-change"){state.simulation.scenario=document.getElementById("sim-scenario")?.value||"storm";state.simulation.complete=false;state.simulation.progress=0;state.simulation.lastMessage="Chua chay";renderApp()}
      else if(action==="start-simulation"){startSimulation()}
      else if(action==="stop-simulation"){stopSimulation()}
      else if(action==="restart-simulation"){navigate("simulation");setTimeout(startSimulation,50)}
    }
    function loginAs(role){
      const a=state.accounts[role]||state.accounts.ADMIN;state.authenticated=true;state.role=role;state.currentUser={...a,status:"ACTIVE"};state.route="dashboard";state.accountOpen=false;renderApp();
    }
    function readSimNumber(id,fallback){const v=Number(document.getElementById(id)?.value);return Number.isFinite(v)?v:fallback}
    function currentScenario(){return document.getElementById("sim-scenario")?.value||state.simulation.scenario||"storm"}
    function scenarioMeta(key=currentScenario()){
      const map={
        storm:{name:"Bão lớn đổ bộ",dataset:"Historical Storm Replay",desc:"Gió tăng nhanh, mưa lớn, tầm nhìn giảm. Dùng để chứng minh risk HIGH/CRITICAL kích hoạt SOP, alert, task và mode STOP.",defaults:[28,75,0.4,1.8,26,94]},
        fog:{name:"Sương mù hạn chế tầm nhìn",dataset:"Visibility Drill",desc:"Tầm nhìn giảm sâu trong khi gió/mưa không quá mạnh. Dùng để chứng minh yếu tố VISIBILITY có thể là dominant factor.",defaults:[7,5,0.3,0.7,23,98]},
        tide:{name:"Triều cường dâng cao",dataset:"Hydro-meteorological Drill",desc:"Mực nước cao kết hợp mưa/gió vừa phải. Backend hiện đánh giá risk theo WIND/RAIN/VISIBILITY, mực nước được đưa vào phần ghi chú nghiệp vụ demo.",defaults:[12,18,3.5,2.4,29,86]}
      };
      return map[key]||map.storm;
    }
    function scenarioName(){return scenarioMeta().name}
    function simStageRows(){
      const wind=readSimNumber("sim-wind",28),rain=readSimNumber("sim-rain",75),vis=readSimNumber("sim-visibility",0.4),factors=[.18,.42,.68,.88,1];
      return factors.map((f,i)=>({no:i+1,minute:i*15,wind:Number((wind*f).toFixed(1)),rain:Number((rain*f).toFixed(1)),vis:Number(Math.max(0.1,vis+(1-f)*8).toFixed(1)),risk:i<1?"LOW":i<2?"MEDIUM":i<3?"HIGH":"CRITICAL"}));
    }
    function buildSimulationPayload(){
      const rows=simStageRows(),temp=readSimNumber("sim-temp",26),hum=readSimNumber("sim-humidity",94),now=Date.now();
      return{scenarioName:scenarioName(),speedMultiplier:Number(document.getElementById("sim-speed")?.value||100),weatherSnapshots:rows.map((r,i)=>({windSpeedMs:r.wind,rainfall1hMm:r.rain,visibilityKm:r.vis,temperatureC:temp,humidityPct:Math.min(100,Math.round(hum*(.72+i*.07))),observedAt:new Date(now+r.minute*60*1000).toISOString(),windDirectionDeg:90+i*18,windGustMs:Number((r.wind*1.25).toFixed(1)),rainfall3hMm:Number((r.rain*1.8).toFixed(1)),pressureHpa:Number((1008-i*5).toFixed(1))}))}
    }
    function renderFlowStep(key,label,table){const done=state.isSimulationActive||state.simulation.complete;return `<div class="flow-step ${done?"active":""}"><small>${esc(table)}</small><strong>${esc(label)}</strong></div>`}
    function renderSimulation(){
      const sim=state.simulation,w=state.weather,meta=scenarioMeta(),rows=simStageRows();
      return `${sectionHead("Chế độ mô phỏng","Data flow: Simulation Dataset → Snapshots → Weather Reading → Risk → SOP → Alert/Task/Mode",sim.complete?badge("Hoàn tất","active"):state.isSimulationActive?badge("DATA ISOLATED ACTIVE","critical"):badge("READY","active"))}
      <div class="grid" style="grid-template-columns:minmax(0,1.25fr) minmax(330px,.75fr)">
        <article class="card simulation-hero"><div class="sim-status"><span class="dot ${state.isSimulationActive?"pulse":""}" style="color:${state.isSimulationActive?"#5dd0e6":"#7ed6a5"}"></span>${state.isSimulationActive?"ĐANG PHÁT SNAPSHOT MÔ PHỎNG":"SẴN SÀNG MÔ PHỎNG"}</div><h2 style="font-size:22px;margin:12px 0 5px">${esc(meta.name)}</h2><p style="font-size:11px;color:#c6d9e2;max-width:760px;line-height:1.6">${esc(meta.desc)} Dữ liệu phát sinh được ghi với cờ <b>isSimulation=true</b>, dùng chung pipeline xử lý nhưng tách khỏi dữ liệu vận hành thật.</p>
          <div class="flow-chain">${renderFlowStep("dataset","Dataset","simulation_datasets")}${renderFlowStep("snapshot","5 snapshots","simulation_snapshots")}${renderFlowStep("weather","Weather readings","operational.weather_readings")}${renderFlowStep("risk","Risk assessment","operational.risk_assessments")}${renderFlowStep("sop","SOP execution","operational.sop_executions")}${renderFlowStep("output","Alert / Task / Mode","alerts · task_logs · mode_log")}</div>
          <div class="progress sim-progress"><span style="width:${sim.progress||0}%"></span></div><div style="display:flex;justify-content:space-between;font-size:9px;color:#bdd3de"><span>Snapshot 1</span><span>${sim.progress||0}% · ${sim.lastMessage||"Chưa chạy"}</span><span>Snapshot 5</span></div>
          <div class="sim-values"><div class="sim-value"><small>Gió</small><strong>${Number(w.wind||0).toFixed(1)} m/s</strong></div><div class="sim-value"><small>Mưa</small><strong>${Number(w.rain||0).toFixed(1)} mm/h</strong></div><div class="sim-value"><small>Tầm nhìn</small><strong>${Number(w.visibility||0).toFixed(1)} km</strong></div><div class="sim-value"><small>Mode</small><strong>${state.operationMode}</strong></div></div>
          <table class="sim-table"><thead><tr><th>#</th><th>+ phút</th><th>Gió</th><th>Mưa</th><th>Tầm nhìn</th><th>Dự kiến</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.no}</td><td>${r.minute}</td><td>${r.wind} m/s</td><td>${r.rain} mm/h</td><td>${r.vis} km</td><td>${r.risk}</td></tr>`).join("")}</tbody></table>
        </article>
        <aside class="card card-pad"><div class="card-title">Thiết lập dataset mô phỏng</div><div class="field" style="margin-top:12px"><label>Kịch bản nghiệp vụ</label><select class="select" id="sim-scenario" data-action="scenario-change"><option value="storm" ${currentScenario()==="storm"?"selected":""}>Bão lớn đổ bộ</option><option value="fog" ${currentScenario()==="fog"?"selected":""}>Sương mù hạn chế tầm nhìn</option><option value="tide" ${currentScenario()==="tide"?"selected":""}>Triều cường dâng cao</option></select></div><div class="grid grid-3" style="gap:8px;margin-top:10px"><button class="btn btn-sm btn-secondary" data-action="preset-scenario" data-scenario="storm">Bão</button><button class="btn btn-sm btn-secondary" data-action="preset-scenario" data-scenario="fog">Sương mù</button><button class="btn btn-sm btn-secondary" data-action="preset-scenario" data-scenario="tide">Triều</button></div><div class="sim-form-grid"><div class="field"><label>Gió đỉnh (m/s)</label><input class="input sim-config" id="sim-wind" type="number" step=".1" value="${meta.defaults[0]}"></div><div class="field"><label>Mưa đỉnh (mm/h)</label><input class="input sim-config" id="sim-rain" type="number" step=".1" value="${meta.defaults[1]}"></div><div class="field"><label>Tầm nhìn thấp nhất (km)</label><input class="input sim-config" id="sim-visibility" type="number" step=".1" value="${meta.defaults[2]}"></div><div class="field"><label>Mực nước (m)</label><input class="input sim-config" id="sim-water" type="number" step=".1" value="${meta.defaults[3]}"></div><div class="field"><label>Nhiệt độ (°C)</label><input class="input sim-config" id="sim-temp" type="number" step=".1" value="${meta.defaults[4]}"></div><div class="field"><label>Độ ẩm (%)</label><input class="input sim-config" id="sim-humidity" type="number" step="1" value="${meta.defaults[5]}"></div></div><div class="field" style="margin-top:10px"><label>Speed multiplier</label><select class="select" id="sim-speed"><option value="25">25x - quan sát chậm</option><option value="50">50x - demo vừa</option><option value="100" selected>100x - demo nhanh</option></select></div><div class="dataflow-note"><strong>${esc(meta.dataset)}</strong><br>UI gửi snapshots vào API; backend ghi weather_readings, Risk Engine tính risk, SOP Engine sinh alert/task/mode. Màn Dashboard/Alert đọc lại operational schema bằng includeSimulation=true khi session đang chạy.</div><div style="display:grid;gap:8px;margin-top:14px">${state.isSimulationActive?`<button class="btn btn-danger" data-action="stop-simulation">${icon("x")} Dừng mô phỏng / quay lại dữ liệu thật</button>`:`<button class="btn btn-primary" data-action="start-simulation">${icon("play")} Kích hoạt mô phỏng theo data flow</button>`}</div></aside>
      </div><article class="card card-pad" style="margin-top:14px"><div class="card-title">Audit trail mô phỏng</div><div class="card-sub">Các phản ứng hệ thống theo thứ tự thời gian</div><div class="list">${sim.events?.length?sim.events.map(e=>`<div class="list-row"><div class="list-icon">${icon(e.icon||"play")}</div><div class="list-main"><strong>${esc(e.title)}</strong><p>${esc(e.detail)}</p></div><span class="list-time">${esc(e.time)}</span></div>`).join(""):`<div class="empty">${icon("play")}<strong>Chưa có dữ liệu mô phỏng</strong>Bấm “Kích hoạt mô phỏng” để phát snapshots qua backend.</div>`}</div></article>`;
    }
    async function startSimulation(){
      try{
        const payload=buildSimulationPayload();state.isSimulationActive=true;state.simulation={...state.simulation,running:true,complete:false,progress:0,lastMessage:"Đang tạo simulation_session",events:[{title:"Simulation session requested",detail:`${payload.weatherSnapshots.length} snapshots · ${payload.scenarioName}`,time:currentClock(),icon:"play"}]};restartPolling();renderApp();
        const session=await api(`/api/ports/${state.portId}/simulation/trigger-scenario`,{method:"POST",body:JSON.stringify(payload)});state.simulation.sessionId=session.id||session.sessionId;state.simulation.lastMessage="Đang replay snapshots";state.simulation.events.unshift({title:"simulation_sessions created",detail:`Session ${state.simulation.sessionId}`,time:currentClock(),icon:"check"});pollSimulationStatus();toast("Đã kích hoạt mô phỏng","Backend đang chạy data flow mô phỏng.");
      }catch(e){state.isSimulationActive=false;state.simulation.running=false;restartPolling();renderApp();handleApiError(e,"Kích hoạt mô phỏng")}
    }
    async function pollSimulationStatus(){
      if(state.simStatusTimer)clearInterval(state.simStatusTimer);
      state.simStatusTimer=setInterval(async()=>{if(!state.simulation.sessionId)return;try{const st=await api(`/api/simulation/status?sessionId=${state.simulation.sessionId}`);state.simulation.progress=Math.round(st.percentComplete??state.simulation.progress??0);state.simulation.lastMessage=`${st.completedSnapshots??0}/${st.totalSnapshots??5} snapshots`;if(st.currentWeather){state.weather={...state.weather,wind:Number(st.currentWeather.windSpeedMs??state.weather.wind),rain:Number(st.currentWeather.rainfall1hMm??state.weather.rain),visibility:Number(st.currentWeather.visibilityKm??state.weather.visibility),temp:Number(st.currentWeather.temperatureC??state.weather.temp),humidity:Number(st.currentWeather.humidityPct??state.weather.humidity),beaufort:toBeaufort(st.currentWeather.windSpeedMs),isSimulation:true}}state.simulation.events.unshift({title:"weather_readings → risk_assessments",detail:state.simulation.lastMessage,time:currentClock(),icon:"refresh"});await refreshAll(true);if(["COMPLETED","CANCELLED","FAILED"].includes(st.status)||state.simulation.progress>=100)finishSimulation(false);else renderApp()}catch(e){handleApiError(e,"Theo dõi mô phỏng")}},1000);
    }
    async function finishSimulation(callStop=true){
      if(state.simStatusTimer){clearInterval(state.simStatusTimer);state.simStatusTimer=null}if(callStop&&state.simulation.sessionId){try{await api("/api/simulation/stop",{method:"POST",body:JSON.stringify({sessionId:state.simulation.sessionId})})}catch{}}
      state.isSimulationActive=false;state.simulation.running=false;state.simulation.complete=true;state.simulation.progress=100;state.simulation.lastMessage="Hoàn tất";state.simulation.events.unshift({title:"Simulation Guard off",detail:"Dữ liệu thật và dữ liệu mô phỏng vẫn tách bằng isSimulation.",time:currentClock(),icon:"check"});restartPolling();await refreshAll(true);renderApp();toast("Mô phỏng hoàn tất","Dashboard quay về dữ liệu vận hành thật.");
    }
    function stopSimulation(){finishSimulation(true)}    document.addEventListener("click",e=>{
      const route=e.target.closest("[data-route]"),action=e.target.closest("[data-action]");
      if(route){e.preventDefault();navigate(route.dataset.route)}else if(action){e.preventDefault();handleAction(action)}
    });
    document.addEventListener("input",e=>{
      if(e.target.matches(".live-filter")){state.filters[e.target.dataset.filter]=e.target.value;const pos=e.target.selectionStart;renderApp();const next=document.querySelector(`[data-filter="${e.target.dataset.filter}"]`);next?.focus();if(next?.setSelectionRange)next.setSelectionRange(pos,pos)}
      if(e.target.matches(".reason-input")){const n=e.target.value.trim().length;document.querySelector(".reason-count").textContent=`${n} / 20 ký tự`;document.getElementById("mode-submit").disabled=n<20}
      if(e.target.matches("input[type=range][data-output]")){document.getElementById(e.target.dataset.output).value=e.target.value}
      if(e.target.matches(".preview-input"))updatePreview();
      if(e.target.matches(".password-strength"))updateStrength(e.target.value);
    });
    document.addEventListener("change",e=>{
      if(e.target.matches(".live-filter")){state.filters[e.target.dataset.filter]=e.target.value;renderApp()}
      if(e.target.matches(".role-select")){const wrap=e.target.closest("form").querySelector(".assigned-port");wrap.classList.toggle("hidden",e.target.value==="ADMIN")}
      if(e.target.id==="sim-scenario"){state.simulation.scenario=e.target.value;state.simulation.complete=false;state.simulation.progress=0;state.simulation.lastMessage="Chua chay";renderApp()}
    });
    document.addEventListener("submit",async e=>{
      e.preventDefault();const f=e.target,fd=new FormData(f);
      if(f.id==="login-form"){try{await loginWithApi(document.getElementById("login-email").value.trim(),document.getElementById("login-password").value)}catch(err){handleApiError(err,"Dang nhap")}}
      if(f.id==="mode-form"){state.operationMode=fd.get("mode");state.events.unshift({id:Date.now(),type:"MODE_OVERRIDE",title:`Ghi đè chế độ thành ${state.operationMode}`,desc:fd.get("reason"),actor:state.currentUser.name,time:new Date().toLocaleTimeString("vi-VN"),color:"#e9a11b"});closeOverlay();renderApp();toast("Đã ghi đè chế độ",`Chế độ hiện tại: ${state.operationMode}.`)}
      if(f.id==="profile-form"){state.currentUser.name=fd.get("name");state.currentUser.phone=fd.get("phone");renderApp();toast("Đã cập nhật hồ sơ","Thông tin cá nhân đã được lưu.")}
      if(f.id==="password-form"){const np=fd.get("newPassword"),cp=fd.get("confirmPassword"),ok=/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/.test(np);if(!ok||np!==cp){document.getElementById("password-error").textContent=!ok?"Mật khẩu chưa đáp ứng yêu cầu bảo mật.":"Mật khẩu xác nhận không khớp.";return}state.authenticated=false;renderApp();toast("Đổi mật khẩu thành công","Vui lòng đăng nhập lại bằng mật khẩu mới.")}
      if(f.id==="user-form"){const id=+f.dataset.id,obj={name:fd.get("name"),email:fd.get("email"),role:fd.get("role"),port:fd.get("role")==="ADMIN"?"—":fd.get("port"),phone:fd.get("phone"),status:fd.get("status"),last:"Chưa đăng nhập"};if(id){Object.assign(state.users.find(x=>x.id===id),obj)}else state.users.unshift({...obj,id:Date.now(),initials:initials(obj.name)});closeOverlay();renderApp();toast(id?"Đã cập nhật người dùng":"Đã tạo người dùng",`${obj.name} đã được lưu.`)}
      if(f.id==="port-form"){const obj={id:fd.get("code"),name:fd.get("name"),code:fd.get("code"),address:fd.get("address"),lat:fd.get("lat"),lon:fd.get("lon"),mode:"NORMAL",risk:"LOW",alerts:0,updated:"Chưa cập nhật",zones:0};state.ports.push(obj);closeOverlay();renderApp();toast("Đã tạo cảng",`${obj.name} đã được thêm vào hệ thống.`)}
      if(f.id==="zone-form"){const id=+f.dataset.id,obj={name:fd.get("name"),type:fd.get("type"),capacity:fd.get("capacity")||"—"};if(id)Object.assign(state.zones.find(x=>x.id===id),obj);else state.zones.push({...obj,id:Date.now(),risk:"LOW",override:false,status:"Hoạt động"});closeOverlay();renderApp();toast(id?"Đã cập nhật khu vực":"Đã tạo khu vực",`${obj.name} đã được lưu.`)}
      if(f.id==="zone-threshold-form"){const z=state.zones.find(x=>x.id===+f.dataset.id);z.override=fd.get("enabled")==="on";closeOverlay();renderApp();toast("Đã lưu ngưỡng riêng",`Cấu hình của ${z.name} đã cập nhật.`)}
      if(f.id==="sop-form"){const id=+f.dataset.id,obj={code:fd.get("code"),name:fd.get("name"),risk:fd.get("risk"),zone:fd.get("zone"),action:fd.get("action")};if(id)Object.assign(state.sopRules.find(x=>x.id===id),obj);else state.sopRules.push({...obj,id:Date.now(),order:state.sopRules.length+1,active:true,executions:0});closeOverlay();renderApp();toast(id?"Đã cập nhật SOP":"Đã tạo SOP",`${obj.code} đã được lưu.`)}
    });
    document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeOverlay();if(state.sidebarOpen){state.sidebarOpen=false;renderApp()}}});
    function updatePreview(){const wind=+document.getElementById("preview-wind")?.value||0,rain=+document.getElementById("preview-rain")?.value||0,vis=+document.getElementById("preview-vis")?.value||99;let r=wind>=24.5||rain>=50||vis<1?"CRITICAL":wind>=17.2||rain>=25||vis<5?"HIGH":wind>=10.8||rain>=10||vis<10?"MEDIUM":"LOW";const el=document.getElementById("preview-result");if(el)el.innerHTML=`<span class="muted" style="font-size:10px">Kết quả dự kiến</span><div style="font-size:26px;font-weight:800;color:${riskColor(r)};margin:5px 0">${r}</div><div style="font-size:10px;color:#53687b">Đánh giá worst-case từ ba yếu tố</div>`}
    function updateStrength(v){const checks=[v.length>=8,/[A-Z]/.test(v),/[a-z]/.test(v),/\d/.test(v),/[^A-Za-z0-9]/.test(v)].filter(Boolean).length;const bar=document.getElementById("strength-bar"),text=document.getElementById("strength-text");if(bar){bar.style.width=`${checks*20}%`;bar.style.background=checks<3?"#d94848":checks<5?"#e9a11b":"#19a66a"}if(text)text.textContent=checks===5?"Mật khẩu mạnh.":`Đã đáp ứng ${checks}/5 yêu cầu.`}
    setInterval(()=>{const c=document.getElementById("clock");if(c)c.textContent=currentClock()},1000);
    renderApp();if(state.authenticated){restartPolling();refreshAll(true)}
  </script>
</body>
</html>
